targets.folders = ["*"]
targets.exclude_folders = ["Tools"]
targets.exclude_files = ["lldebugger.lua"]

# Each rule: enabled (bool) + optional severity override ("error" | "warn").
# Rules live in Tools/LuaStructurizer/Modules/<Name>.py and expose
# check(stripped, path, config) -> list[(line:int, message:str, severity:str)].
# Optional set_path(path) / set_original(text) hooks let a rule receive the file
# path or the un-blanked source (string/comment contents are blanked in `stripped`).

[Rules.PrintVsLog]
enabled = true
severity = "error"

[Rules.DotColonMix]
enabled = true
severity = "warn"

[Rules.UnguardedStringMode]
enabled = true
severity = "warn"

[Rules.ModuleSingleton]
enabled = true
severity = "warn"

[Rules.RngPairing]
enabled = true
severity = "error"

[Rules.LogCaps]
enabled = true
severity = "warn"

# Manifest seeded at FieldOwnership.toml (_state/flipX -> Control).
[Rules.FieldOwnership]
enabled = true
severity = "error"

[Rules.SpriteNewOutsideCore]
enabled = true
severity = "error"

[Rules.ComponentCreateOutsideCore]
enabled = true
severity = "error"

[Rules.LocalScanOutsideCore]
enabled = true
severity = "error"

[Rules.DuplicateLogCall]
enabled = true
severity = "warn"

[Rules.TypeFieldPlacement]
enabled = true
severity = "warn"

[Rules.FilePathSlash]
enabled = true
severity = "error"
