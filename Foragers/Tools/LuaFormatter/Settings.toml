[targets]
# Directories to process (relative to project root). Use "*" for everything.
folders = ["Content/Assets/Sprites", "Content/Assets/UI"]
exclude_folders = []
exclude_files = []

[Modules.ComponentSort]
enabled = true

[Modules.StringifyTags]
enabled = true

[Modules.NormalizeNumbers]
enabled = true
collapse_integer_floats = true

[Modules.ParamSort]
enabled = true

[Modules.AddBlankLines]
enabled = true

[param_order]
order = [
    "extends",
    "object",
    "frameWidth",
    "frameHeight",
    "pivotX",
    "pivotY",
    "angle",
    "layer",
    "sortOffsetY",
]

[component_order]
order = [
    "player_stats",
    "spritesheet",
    "spritefont",
    "shadow",
    "control",
    "collision",
    "scroll_to",
    "follow",
    "destructible",
    "drop",
    "weapon",
    "shake",
    "tween",
    "particle_emitter",
    "text_emitter",
    "sound",
    "ui",
    "counter",
    "silhouette",
    "shader",
]
