targets.folders = ["*"]
targets.exclude_folders = ["Tools"]
targets.exclude_files = ["lldebugger.lua"]

Modules.Stringify.enabled = true
Modules.Sort.enabled = true
Modules.Sort.include_folders = ["Content/"]
Modules.NormalizeNumbers.enabled = true
Modules.NormalizeNumbers.collapse_integer_floats = true
Modules.AddBlankLines.enabled = true

Modules.WrapTables.enabled = true
Modules.WrapTables.include_folders = ["Content/"]

# A param lands in the group whose tag shares the most words with its key
# (camelCase-aware: offsetX -> offset,x); ties go to the earlier group.
# Unknown keys stay last in file order. Tune tags here.
param_groups.order = "identity size frame pivot coords motion ambients stats appearance timing content ui sound options"
param_groups.identity.tags = "mode name extends object order debug snapshot postprocess seed id type module priority appliesTo applies_to host event field maxField sourceType image label clientId largeImageKey"
param_groups.size.tags = "width height scale tileSize chunkSize"
param_groups.frame.tags = "frameWidth frameHeight collisionWidth collisionHeight columns rows animations chars charSpacing spacing font"
param_groups.pivot.tags = "pivotX pivotY"
param_groups.coords.tags = "offsetX offsetY x y"
param_groups.motion.tags = "moveX moveY moving movementSpeed swimmingSpeed moveThreshold followRadius followDelay accelerate gravity bob smoothness smoothnessX smoothnessY parallax rotate angle leanAngle leanThreshold leanSmoothness slowdown"
param_groups.stats.tags = "level maxLevel experience xp xpCurve satiety maxSatiety satietyDrain lowSatietyPercent lowSatietyWarnings lowSatietyZoom lowSatietyMaskRadius hp damage range cooldown critChance critMult swing drops attackSpeed"
param_groups.appearance.tags = "color backgroundColor borderTileOffset tint brightness noise shaders shader uniforms silhouette magnitude decay curve replaceWith visible"
param_groups.timing.tags = "duration interval stepInterval count hideDelay spawnOn triggerOn destroy destroyCurve changeDirectionInterval spawnTime"
param_groups.content.tags = "props tags tweens particle inheritFlip details image largeImageText stateByScene"
param_groups.ui.tags = "horizontalAlign verticalAlign text layer sortOffsetY"
param_groups.sound.tags = "volume pitch pitchRandomness"
param_groups.ambients.tags = "fadeInDuration fadeOutDuration wanderingSpeed"
param_groups.options.tags = "fullscreen vsync maxFps gamepadDeadzone mouseSlowdownRadius restartHoldDuration enabled"

component_order.order = "spritesheet spritefont player_stats shadow control collision scroll_to follow destructible drop pickup ambient weapon shake tween particle_emitter text_emitter emote sound cursor ui image text counter emissive silhouette shader"

tween_order.order = "x y scale_x scale_y angle brightness tint_mix alpha"
